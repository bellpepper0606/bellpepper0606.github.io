*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic UI","Hiragino Kaku Gothic ProN",sans-serif;line-height:1.6}button,input,select{font:inherit}.wrap{max-width:900px;margin:auto;padding:10px 10px 42px}header{padding:4px 2px 10px}h1{font-size:21px;margin:0;font-weight:850}header p{font-size:12px;color:var(--muted);margin:2px 0 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:#e9e9e4;border-radius:14px;margin-bottom:10px;position:sticky;top:4px;z-index:20}.tabs button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:800;color:#666;cursor:pointer}.tabs button.active{background:#fff;color:#111;box-shadow:0 2px 10px #00000010}.panel,.singleCard{background:#fff;border:1px solid var(--line);border-radius:16px}.panel{padding:12px;margin-bottom:10px}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.settings label span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.settings select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 11px}.panelBottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.stats{font-size:12px;color:var(--muted)}.stats b{color:#222}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:#222;color:#fff}.secondary{background:#ecece7;color:#222}.ghost{background:#fff;border:1px solid var(--line)}.hidden{display:none!important}.singleCard{padding:18px}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.progress{height:7px;background:#ecece7;border-radius:999px;overflow:hidden;margin:12px 0 0}.bar{height:100%;background:#333;width:0}.prompt{font-size:20px;font-weight:780;line-height:1.55;margin:24px 0 18px}.singleInput{width:100%;border:2px solid #cfcfc8;border-radius:13px;padding:13px 14px;font-size:18px;outline:none}.singleInput:focus{border-color:#555}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.feedback{display:none;margin-top:12px;border-radius:12px;padding:11px 12px}.feedback.show{display:block}.feedback.ok{background:var(--okbg);color:var(--ok);border:1px solid #cfe8d7}.feedback.ng{background:var(--ngbg);color:var(--ng);border:1px solid #efcccc}.correct{font-size:18px;font-weight:850}.listTitle{display:flex;justify-content:space-between;align-items:center;padding:3px 2px 6px}.listTitle b{font-size:15px}.listTitle span{font-size:12px;color:var(--muted)}.qcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0}.qtop{display:flex;gap:10px;align-items:flex-start}.qnum{flex:none;width:30px;height:30px;border-radius:999px;background:#ecece7;display:grid;place-items:center;font-size:12px;font-weight:850}.qtext{font-weight:700;line-height:1.55}.qrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.qinput{min-width:0;border:1.5px solid #cfcfc8;border-radius:11px;padding:10px 11px;outline:none}.qinput:focus{border-color:#555}.grade{border:0;border-radius:10px;background:#222;color:#fff;font-weight:800;padding:9px 14px;cursor:pointer}.grade:disabled{opacity:.45}.qresult{display:none;margin-top:9px;border-radius:10px;padding:9px 10px;font-size:14px}.qresult.show{display:block}.qresult.ok{background:var(--okbg);color:var(--ok)}.qresult.ng{background:var(--ngbg);color:var(--ng)}.qcard.graded-ok{border-color:#b8ddc4}.qcard.graded-ng{border-color:#e3bcbc}.stickyTools{position:sticky;bottom:8px;z-index:15;background:#ffffffee;backdrop-filter:blur(7px);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:12px;display:flex;gap:8px;justify-content:space-between;align-items:center;box-shadow:0 5px 24px #00000010}.stickyTools>span{font-size:12px;color:var(--muted)}.stickyTools>div{display:flex;gap:7px}.note{font-size:11px;color:var(--muted);text-align:center;margin:13px 3px 0}@media(max-width:620px){.wrap{padding:8px 8px 34px}h1{font-size:18px}.settings{grid-template-columns:1fr}.panelBottom{align-items:flex-start;flex-direction:column}.singleCard{padding:14px}.prompt{font-size:18px;margin:20px 0 15px}.singleInput{font-size:17px}.qrow{grid-template-columns:1fr}.grade{min-height:44px}.stickyTools{align-items:stretch;flex-direction:column}.stickyTools>div{display:grid;grid-template-columns:1fr 1fr}.stickyTools .btn{min-height:44px}.qcard{padding:12px}}

<body>
<div class="wrap">
<header><h1>気候用語 暗記テスト</h1><p>プリント語群・表記厳密</p></header>
<nav class="tabs"><button id="singleTab" class="active">1問ずつ</button><button id="listTab">一覧テスト</button></nav>
<section class="panel"><div class="settings"><label><span>出題範囲</span><select id="category"><option value="all">すべて</option></select></label><label><span>問題数</span><select id="count"><option>10</option><option selected>20</option><option>30</option><option value="all">全語</option></select></label><label><span>選び方</span><select id="mode"><option value="random">ランダム</option><option value="weak">苦手優先</option><option value="unseen">未出題優先</option></select></label></div><div class="panelBottom"><button id="newSet" class="btn secondary">新しいセット</button><div class="stats">正解 <b id="okN">0</b>　不正解 <b id="ngN">0</b>　正答率 <b id="acc">—</b></div></div></section>
<section id="singleView" class="singleCard"><div class="meta"><span id="singleCat">—</span><span id="singleCounter">0 / 0</span></div><div class="progress"><div id="singleBar" class="bar"></div></div><div id="singlePrompt" class="prompt">問題を準備しています…</div><input id="singleInput" class="singleInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力"><div id="singleFeedback" class="feedback"></div><div class="actions"><button id="singleGrade" class="btn primary">採点</button><button id="singleReveal" class="btn secondary">正解を見る</button><button id="singleNext" class="btn primary hidden">次へ</button></div></section>
<section id="listView" class="hidden"><div class="listTitle"><b>一覧テスト</b><span>各問ごとに採点できます</span></div><div id="questions"></div><div class="stickyTools"><span id="status">0 / 0 問採点済み</span><div><button id="gradeAnswered" class="btn secondary">回答済みをまとめて採点</button><button id="focusFirst" class="btn ghost">最初の未採点へ</button></div></div></section>
<p class="note">前後の空白のみ無視します。漢字・かな・プリントにない表記は不正解。括弧内が別表記の場合は、その各表記を個別に正解として扱います。</p>
</div>
<script>
const DATA=[{"a":"気候要素","c":"基礎","p":["気温・降水量・風・湿度・日照など、気候を構成するものを何というか。","気温や降水量など、ある地域の気候そのものを表す項目の総称は何か。","「気温・降水量・風」などをまとめた、気候を構成する要素の名称は何か。"]},{"a":"気候因子","c":"基礎","p":["緯度・標高・地形など、気候要素に影響を与えるものを何というか。","ある地域の気温や降水量などに影響を与える、緯度・標高・地形などの条件を何というか。","気候要素を左右する「緯度・標高・地形」などの総称は何か。"]},{"a":"ケッペン","c":"基礎","p":["世界の気候区分で知られる人物は誰か。","気温と降水量などをもとにした気候区分を示した人物は誰か。","気候区分の名称としてプリントに登場する人物名を答えよ。"]},{"a":"赤道低圧帯","alts":["熱帯収束帯"],"c":"大気循環","p":["赤道付近で強く熱せられた空気が上昇し、上昇気流が卓越する気圧帯を何というか。","赤道付近に形成され、上昇気流と多雨に関係する気圧帯をプリントの表記で答えよ。","南北の貿易風が集まりやすい赤道付近の低圧帯を、プリントの語群どおりに答えよ。"]},{"a":"中緯度高圧帯","alts":["亜熱帯高圧帯"],"c":"大気循環","p":["赤道付近で上昇した空気が下降し、下降気流が卓越する緯度30°付近の気圧帯を何というか。","南北30°付近にみられ、乾燥地域の形成にも関係する高圧帯をプリントの表記で答えよ。","ハドレー循環の下降域にあたる高圧帯を、プリントの語群どおりに答えよ。"]},{"a":"亜寒帯低圧帯","c":"大気循環","p":["南北40～60°付近で、暖気と寒気がぶつかり上昇気流が生じやすい低圧帯を何というか。","中緯度高圧帯と極高圧帯の間に位置する低圧帯を何というか。","偏西風と極東風がぶつかる側に位置する低圧帯を何というか。"]},{"a":"極高圧帯","c":"大気循環","p":["極付近で空気が強く冷やされ、下降気流が卓越する高圧帯を何というか。","南北の極付近に形成される高圧帯を何というか。","極東風が吹き出す側に位置する高圧帯を何というか。"]},{"a":"ハドレー循環","c":"大気循環","p":["赤道低圧帯と中緯度高圧帯の間でみられる大気の循環を何というか。","赤道付近で上昇し、緯度30°付近で下降する大気循環を何というか。","低緯度側の大気大循環のセルを何というか。"]},{"a":"フェレル循環","c":"大気循環","p":["中緯度高圧帯と亜寒帯低圧帯の間でみられる大気循環を何というか。","ハドレー循環の高緯度側に隣接する中緯度の大気循環を何というか。","中緯度に位置し、偏西風と関係する大気循環を何というか。"]},{"a":"恒常風","c":"風","p":["広い地域で長期間、ほぼ一定の方向に吹く風を何というか。","貿易風や偏西風のように、地球規模でほぼ一定方向に吹く風の総称は何か。","大気大循環にともない広域で継続的に吹く風を何というか。"]},{"a":"局地風","c":"風","p":["限られた地域に特徴的に吹く風を何というか。","特定の地形や地域条件によって狭い範囲で吹く風を何というか。","恒常風に対して、地域的にみられる風を何というか。"]},{"a":"北東貿易風","c":"風","p":["北半球で中緯度高圧帯から赤道低圧帯へ向かって吹く貿易風を何というか。","北半球の低緯度で、北東から南西方向へ吹く恒常風を何というか。","北半球側の貿易風の名称を答えよ。"]},{"a":"南東貿易風","c":"風","p":["南半球で中緯度高圧帯から赤道低圧帯へ向かって吹く貿易風を何というか。","南半球の低緯度で、南東から北西方向へ吹く恒常風を何というか。","南半球側の貿易風の名称を答えよ。"]},{"a":"偏西風","c":"風","p":["中緯度高圧帯から亜寒帯低圧帯へ向かって吹く、西寄りの恒常風を何というか。","中緯度で西から東へ向かって吹く代表的な恒常風を何というか。","日本付近を含む中緯度帯で卓越する西寄りの風を何というか。"]},{"a":"極東風","c":"風","p":["極高圧帯から亜寒帯低圧帯へ向かって吹く東寄りの恒常風を何というか。","極付近から低緯度側へ吹き出す東寄りの風を何というか。","高緯度で吹く東寄りの恒常風を何というか。"]},{"a":"フンボルト海流","c":"海流","p":["南アメリカ大陸西岸、ペルー～チリ沖を北上する寒流を何というか。","アタカマ砂漠の乾燥にも関係する、南米西岸の寒流を何というか。","ペルー沖の湧昇やアンチョビ漁場と関係の深い寒流を何というか。"]},{"a":"ベンゲラ海流","c":"海流","p":["アフリカ大陸南西岸を流れる寒流を何というか。","ナミブ砂漠の乾燥と関係する寒流を何というか。","南西アフリカ沿岸を北向きに流れる寒流を何というか。"]},{"a":"カナリア海流","c":"海流","p":["アフリカ大陸北西岸を流れる寒流を何というか。","北西アフリカ沿岸に沿って流れる寒流を何というか。","大西洋東部、アフリカ北西岸側の寒流を何というか。"]},{"a":"カリフォルニア海流","c":"海流","p":["北アメリカ大陸西岸を流れる寒流を何というか。","アメリカ西岸、カリフォルニア沖を南下する寒流を何というか。","北太平洋東部の大陸西岸を流れる寒流を何というか。"]},{"a":"熱帯雨林気候","c":"熱帯・土壌","p":["一年を通して高温多雨で、熱帯雨林が発達する気候を何というか。","年中高温で降水量が多い熱帯の気候を何というか。","乾季がほとんどなく、熱帯雨林が広がる気候を何というか。"]},{"a":"サバナ気候","c":"熱帯・土壌","p":["一年中高温だが、雨季と乾季がはっきりしている気候を何というか。","熱帯で乾季があり、サバナが広がる気候を何というか。","熱帯雨林気候より乾季が明瞭な熱帯の気候を何というか。"]},{"a":"フェラルソル","alts":["ラトソル"],"c":"熱帯・土壌","p":["熱帯地域にみられる赤色～赤黄色系の土壌を、プリントの語群どおりに答えよ。","高温多雨の熱帯で強い風化・溶脱を受けてできる土壌を、プリントの表記で答えよ。","熱帯雨林地域などに分布する代表的な土壌名を答えよ。"]},{"a":"成帯土壌","c":"熱帯・土壌","p":["気候や植生の影響を強く受けて形成される土壌を何というか。","緯度に対応した気候帯・植生帯との関係が強い土壌を何というか。","気候条件を反映して帯状に分布しやすい土壌を何というか。"]},{"a":"間帯土壌","c":"熱帯・土壌","p":["気候以外の局地的な条件の影響を強く受ける土壌を何というか。","母岩や地形、水分条件などの地域条件の影響が大きい土壌を何というか。","成帯土壌に対して、局地的条件によって形成される土壌を何というか。"]},{"a":"アタカマ砂漠","c":"乾燥帯","p":["南アメリカ大陸西岸にあり、フンボルト海流など寒流の影響を受ける砂漠を何というか。","チリ北部を中心に広がる、寒流の影響を受ける海岸砂漠を何というか。","南米西岸に位置する代表的な海岸砂漠を何というか。"]},{"a":"ナミブ砂漠","c":"乾燥帯","p":["アフリカ大陸南西岸にあり、ベンゲラ海流の影響を受ける砂漠を何というか。","南西アフリカの大西洋岸に沿って広がる海岸砂漠を何というか。","寒流の影響を受けるアフリカ南西岸の砂漠を何というか。"]},{"a":"ステップ気候","c":"乾燥帯","p":["砂漠気候より降水量が多く、草原がみられる乾燥気候を何というか。","乾燥帯のうち、短い草原が広がる気候を何というか。","BWよりやや湿潤で、BSにあたる気候を何というか。"]},{"a":"カナート","c":"乾燥帯","p":["乾燥地域で、地下水を地下水路によって農地や集落へ導く施設を何というか。","山麓の地下水を地下の水路で乾燥地域へ運ぶ灌漑施設を何というか。","蒸発を抑えるため地下に水路を設ける乾燥地域の伝統的灌漑施設を何というか。"]},{"a":"チェルノーゼム","c":"乾燥帯","p":["ウクライナ～ロシアなどのステップ地域にみられる、黒く肥沃な土壌を何というか。","「黒土」とも呼ばれる肥沃な土壌を何というか。","ステップ草原に発達する黒色の肥沃な土壌を何というか。"]},{"a":"サヘル","c":"乾燥帯","p":["サハラ砂漠南縁に位置し、砂漠化が問題となっている地域を何というか。","アフリカでサハラ砂漠の南側に帯状に広がる半乾燥地域を何というか。","砂漠化の進行が代表的に扱われる、サハラ南縁の地域名を答えよ。"]},{"a":"アム川","c":"乾燥帯","p":["アラル海へ流れ込む川の一つで、灌漑用水として大量利用された川を何というか。","アラル海縮小の学習で、シル川とともに登場する河川のうち南側の川を何というか。","中央アジアでアラル海へ注ぐ主要河川の一つを答えよ。"]},{"a":"シル川","c":"乾燥帯","p":["アラル海へ流れ込む川の一つで、灌漑用水として大量利用された川を何というか。","アラル海縮小の学習で、アム川とともに登場する河川のうち北側の川を何というか。","中央アジアでアラル海へ注ぐ主要河川の一つを答えよ。"]},{"a":"エルニーニョ現象","c":"エルニーニョ","p":["赤道付近の太平洋で海面水温が平年より高い状態が長期間続く現象を何というか。","貿易風が弱まり、太平洋東部の海面水温が上がる現象を何というか。","ペルー沖の湧昇が弱まり、アンチョビ生産量の減少にもつながる現象を何というか。"]},{"a":"ラニーニャ現象","c":"エルニーニョ","p":["赤道付近の太平洋で海面水温が平年より低い状態が長期間続く現象を何というか。","エルニーニョ現象とは反対に、太平洋東部の海面水温が低くなる現象を何というか。","貿易風が平常時より強まりやすい側の現象を何というか。"]},{"a":"湧昇","alts":["湧昇流"],"c":"エルニーニョ","p":["海の深いところから冷たい海水が海面付近へ上がってくることを、プリントの語群どおりに何というか。","ペルー沖で、深層の冷たい海水が表面へ上がる現象をプリントの表記で答えよ。","アンチョビ漁場を支える、深い海からの冷水の上昇を何というか。"]},{"a":"アンチョビ","c":"エルニーニョ","p":["ペルー沖で多く漁獲され、エルニーニョ現象の際に生産量が減少する魚を何というか。","プリントのグラフで、ペルー沖の生産量と海面水温の関係が示されている魚を何というか。","湧昇による豊かな漁場と関係が深く、エルニーニョ時に漁獲への影響が出る魚を何というか。"]}];
const $=id=>document.getElementById(id);const E=Object.fromEntries(['singleTab','listTab','category','count','mode','newSet','okN','ngN','acc','singleView','listView','singleCat','singleCounter','singleBar','singlePrompt','singleInput','singleFeedback','singleGrade','singleReveal','singleNext','questions','status','gradeAnswered','focusFirst'].map(id=>[id,$(id)]));for(const c of [...new Set(DATA.map(x=>x.c))]){const o=document.createElement('option');o.value=c;o.textContent=c;E.category.appendChild(o)}let hist=JSON.parse(localStorage.getItem('climateQuizHistoryGH')||'{}'),set=[],session={ok:0,ng:0},singlePos=0,singleState='ask',active=location.hash==='#list'?'list':'single',composing=false;const save=()=>localStorage.setItem('climateQuizHistoryGH',JSON.stringify(hist)),key=q=>q.a,answers=q=>[q.a,...(q.alts||[])],isCorrect=(q,v)=>answers(q).includes(v.trim()),answerText=q=>answers(q).join(' / '),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function weakness(q){const h=hist[key(q)]||{ok:0,ng:0,seen:0};return(h.ng*4+2)/(h.ok+h.ng+2)+1/(h.seen+1)}function choosePrompt(q){const h=hist[key(q)]||{},all=q.p.map((_,i)=>i),opts=all.filter(i=>i!==h.lastPrompt),pool=opts.length?opts:all,i=pool[Math.floor(Math.random()*pool.length)];hist[key(q)]={...(hist[key(q)]||{ok:0,ng:0,seen:0}),lastPrompt:i};return q.p[i]}function buildSet(){let p=DATA.filter(q=>E.category.value==='all'||q.c===E.category.value);if(E.mode.value==='weak')p=p.map(q=>({q,r:Math.random()/Math.max(.05,weakness(q))})).sort((a,b)=>a.r-b.r).map(x=>x.q);else if(E.mode.value==='unseen')p=p.slice().sort((a,b)=>((hist[key(a)]?.seen||0)-(hist[key(b)]?.seen||0))||Math.random()-.5);else p=p.slice().sort(()=>Math.random()-.5);const n=E.count.value==='all'?p.length:Math.min(+E.count.value,p.length);set=p.slice(0,n).map(q=>({q,prompt:choosePrompt(q),graded:false,ok:null}));session={ok:0,ng:0};singlePos=0;singleState='ask';save();renderActive();updateStats()}function record(item,ok){if(item.graded)return;item.graded=true;item.ok=ok;const h=hist[key(item.q)]||{ok:0,ng:0,seen:0};h.seen++;ok?h.ok++:h.ng++;hist[key(item.q)]=h;ok?session.ok++:session.ng++;save();updateStats()}function setTab(name){active=name;const list=name==='list';E.singleView.classList.toggle('hidden',list);E.listView.classList.toggle('hidden',!list);E.singleTab.classList.toggle('active',!list);E.listTab.classList.toggle('active',list);history.replaceState(null,'',list?'#list':'#single');renderActive()}function renderActive(){active==='list'?renderList():renderSingle()}function updateStats(){E.okN.textContent=session.ok;E.ngN.textContent=session.ng;const t=session.ok+session.ng;E.acc.textContent=t?Math.round(session.ok/t*100)+'%':'—';if(E.status)E.status.textContent=`${set.filter(x=>x.graded).length} / ${set.length} 問採点済み`}function renderSingle(){if(!set.length)return;if(singlePos>=set.length){E.singleCat.textContent='終了';E.singleCounter.textContent=`${set.length} / ${set.length}`;E.singleBar.style.width='100%';E.singlePrompt.textContent=`セット終了：${session.ok} / ${session.ok+session.ng} 正解`;E.singleInput.classList.add('hidden');E.singleGrade.classList.add('hidden');E.singleReveal.classList.add('hidden');E.singleNext.classList.add('hidden');E.singleFeedback.className='feedback';return}const item=set[singlePos];E.singleInput.classList.remove('hidden');E.singleGrade.classList.remove('hidden');E.singleReveal.classList.remove('hidden');E.singleNext.classList.add('hidden');E.singleInput.disabled=false;E.singleInput.value='';E.singleCat.textContent=item.q.c;E.singleCounter.textContent=`${singlePos+1} / ${set.length}`;E.singleBar.style.width=`${singlePos/set.length*100}%`;E.singlePrompt.textContent=item.prompt;E.singleFeedback.className='feedback';E.singleFeedback.innerHTML='';singleState='ask';setTimeout(()=>E.singleInput.focus(),30)}function gradeSingle(reveal=false){if(singlePos>=set.length||singleState!=='ask')return;const item=set[singlePos],v=E.singleInput.value.trim();if(!v&&!reveal)return;const ok=!reveal&&isCorrect(item.q,v);record(item,ok);E.singleFeedback.className='feedback show '+(ok?'ok':'ng');E.singleFeedback.innerHTML=ok?`正解。<div class="correct">${esc(answerText(item.q))}</div>`:`不正解。正解は <div class="correct">${esc(answerText(item.q))}</div>`;E.singleInput.disabled=true;E.singleGrade.classList.add('hidden');E.singleReveal.classList.add('hidden');E.singleNext.classList.remove('hidden');singleState='done';E.singleNext.focus()}function nextSingle(){singlePos++;renderSingle()}function renderList(){if(!set.length)return;E.questions.innerHTML=set.map((item,i)=>`<article class="qcard ${item.graded?(item.ok?'graded-ok':'graded-ng'):''}" data-i="${i}"><div class="qtop"><div class="qnum">${i+1}</div><div class="qtext">${esc(item.prompt)}</div></div><div class="qrow"><input class="qinput" data-input="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力" ${item.graded?'disabled':''}><button class="grade" data-grade="${i}" ${item.graded?'disabled':''}>採点</button></div><div class="qresult ${item.graded?'show '+(item.ok?'ok':'ng'):''}">${item.graded?(item.ok?'正解':'不正解。正解：'+esc(answerText(item.q))):''}</div></article>`).join('');E.questions.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>gradeList(+b.dataset.grade));E.questions.querySelectorAll('.qinput').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();gradeList(+inp.dataset.input)}}));updateStats()}function gradeList(i){const item=set[i];if(!item||item.graded)return;const card=E.questions.querySelector(`.qcard[data-i="${i}"]`),inp=card.querySelector('.qinput'),v=inp.value.trim();if(!v){inp.focus();return}const ok=isCorrect(item.q,v);record(item,ok);card.classList.add(ok?'graded-ok':'graded-ng');inp.disabled=true;card.querySelector('.grade').disabled=true;const r=card.querySelector('.qresult');r.className='qresult show '+(ok?'ok':'ng');r.textContent=ok?'正解':'不正解。正解：'+answerText(item.q);updateStats()}function gradeAnswered(){for(const card of E.questions.querySelectorAll('.qcard')){const i=+card.dataset.i,inp=card.querySelector('.qinput');if(!set[i].graded&&inp.value.trim())gradeList(i)}}function focusFirst(){const inp=[...E.questions.querySelectorAll('.qinput')].find(x=>!x.disabled);if(inp){inp.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>inp.focus(),250)}}E.singleTab.onclick=()=>setTab('single');E.listTab.onclick=()=>setTab('list');E.newSet.onclick=buildSet;E.category.onchange=buildSet;E.singleGrade.onclick=()=>gradeSingle(false);E.singleReveal.onclick=()=>gradeSingle(true);E.singleNext.onclick=nextSingle;E.gradeAnswered.onclick=gradeAnswered;E.focusFirst.onclick=focusFirst;E.singleInput.addEventListener('compositionstart',()=>composing=true);E.singleInput.addEventListener('compositionend',()=>composing=false);E.singleInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!composing){e.preventDefault();singleState==='ask'?gradeSingle(false):nextSingle()}});buildSet();setTab(active);
